services:
  - type: web
    name: pivotnews-videos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Docker runtime bakes in ffmpeg (see backend/Dockerfile), which the
    # assembly stage requires.
    # Secrets (R2 + provider API keys) come from the workspace env group.
    envVars:
      - fromGroup: Chef Peppy

  - type: web
    name: pivotnews-videos-dashboard
    runtime: static
    rootDir: frontend
    staticPublishPath: .
