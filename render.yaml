services:
  - type: web
    name: pivotnews-videos-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # FFmpeg is required by the assembly stage (Phase 5+).
    # On Render, install it via a build step or a Docker runtime; the python
    # runtime image does not ship ffmpeg by default.
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: SUNO_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

  - type: web
    name: pivotnews-videos-dashboard
    runtime: static
    rootDir: frontend
    staticPublishPath: .
